<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit Fitness-Schule</title>
<meta name="theme-color" content="#06080c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--r:18px;--mono:"JetBrains Mono",ui-monospace,monospace;--sans:Inter,system-ui,-apple-system,sans-serif}
:root[data-theme=dark]{--bg:#06080c;--bg2:#0a0e14;--card:#0f141c;--card2:#131a24;--vid:#0a0f16;--line:#1c2632;--line2:#2b3746;--text:#e8eef5;--muted:#8796a8;--fig:#e8eef5;--fig2:#5f6d7e;--grid:rgba(255,255,255,.035);--ground:#3a4757;--shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-theme=light]{--bg:#eef2f6;--bg2:#e5eaf0;--card:#ffffff;--card2:#f6f8fb;--vid:#fbfcfe;--line:#dbe2ea;--line2:#c3cdd9;--text:#0e1620;--muted:#5a6878;--fig:#1a2533;--fig2:#9fadbd;--grid:rgba(0,0,0,.05);--ground:#a7b3c1;--shadow:0 8px 24px rgba(20,40,70,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background-image:radial-gradient(900px 400px at 85% -10%,rgba(47,210,122,.07),transparent),radial-gradient(700px 400px at -10% 10%,rgba(59,158,255,.07),transparent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2fd27a,#3b9eff);color:#06110b;font:800 16px var(--mono);flex:none}
.logo b{display:block;font:800 10px var(--mono);letter-spacing:.14em;color:var(--muted)}
.logo span{display:block;font:800 16px var(--sans);letter-spacing:-.01em;white-space:nowrap}
.theme{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.theme button{font:700 11px var(--mono);padding:6px 9px;border-radius:999px;color:var(--muted);white-space:nowrap}
.theme button.on{background:var(--text);color:var(--bg)}
.wrap{display:flex;max-width:1280px;margin:0 auto}
#side{display:none}
#view{flex:1;min-width:0;padding:18px 16px 60px}
.kick{font:800 10.5px var(--mono);letter-spacing:.14em;color:var(--acc,var(--muted))}
.hero{padding:10px 2px 18px}
.hero h1{font:800 clamp(34px,8vw,54px)/1.02 var(--sans);letter-spacing:-.03em;margin:8px 0 10px}
.hero p{color:var(--muted);font-size:15px;line-height:1.55;max-width:640px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 12px}
.stats span{font:600 11px var(--mono);color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.stats b{color:var(--text)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--acc,#2fd27a);border-radius:9px;transition:width .4s}
.bar.big{height:8px;max-width:640px}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:8px;padding:16px;min-height:170px;border-radius:var(--r);background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 14%,var(--card)),var(--card) 60%);border:1px solid color-mix(in srgb,var(--acc) 28%,var(--line));box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--acc)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%)}
.tile.wide{grid-column:span 2}
.tile .ic{font-size:34px;width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--acc) 18%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.tile .tt{font:800 14px var(--mono);letter-spacing:.06em;color:var(--acc)}
.tile .ds{font-size:13px;line-height:1.45;color:var(--muted);flex:1}
.tile .pr{display:flex;align-items:center;gap:8px}
.tile .pn{font:700 11px var(--mono);color:var(--muted)}
.tile .go{font:800 12px var(--mono);color:var(--acc)}
.note{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5;padding:12px 14px;border:1px dashed var(--line2);border-radius:12px}
.crumbs{margin-bottom:12px}
.back{font:700 12px var(--mono);color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.back:hover{color:var(--text)}
.ahead{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 16%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));margin-bottom:14px}
.ahead .ic{font-size:38px;width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:18px;background:color-mix(in srgb,var(--acc) 18%,transparent)}
.ahead h1{font:800 26px var(--sans);letter-spacing:-.02em;margin:4px 0}
.ahead p{color:var(--muted);font-size:14px}
.lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lcard{text-align:left;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.lcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.lcard .thumb{width:100%;aspect-ratio:10/7;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;display:block}
.lcard .lk{font:800 10px var(--mono);letter-spacing:.12em;color:var(--acc)}
.lcard .lk b{color:#2fd27a}
.lcard .lt{font-weight:700;font-size:15px;line-height:1.25}
.lcard .ls{font-size:12px;color:var(--muted);line-height:1.35}
.lcard .lv{margin-top:4px;align-self:flex-start;font:700 9.5px var(--mono);padding:3px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.lcard.done{border-color:color-mix(in srgb,#2fd27a 45%,var(--line))}
.lhead h1{font:800 clamp(26px,6vw,36px)/1.1 var(--sans);letter-spacing:-.02em;margin:6px 0 4px}
.lhead p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.chip{font:600 11px var(--mono);padding:5px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.player{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.screen{position:relative}
#cv{display:block;width:100%;aspect-ratio:10/7;cursor:pointer;background:var(--vid)}
.bigplay{position:absolute;inset:0;margin:auto;width:66px;height:66px;border-radius:50%;background:var(--acc);color:#08111a;font-size:24px;box-shadow:0 8px 30px color-mix(in srgb,var(--acc) 50%,transparent)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.cb{width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:15px;flex:none}
.cb#play{background:var(--acc);color:#08111a;border-color:transparent;font-weight:800}
#scrub{flex:1;min-width:120px;accent-color:var(--acc);height:28px}
.time{font:600 11px var(--mono);color:var(--muted);min-width:78px;text-align:right}
.speed{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.speed button{font:700 11px var(--mono);padding:8px 9px;color:var(--muted)}
.speed button.on{background:var(--acc);color:#08111a}
.stepbtns{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.stepbtns button{min-width:36px;height:32px;border-radius:9px;font:800 12px var(--mono);border:1px solid var(--line);color:var(--muted);background:var(--card2)}
.stepbtns button.past{color:var(--text);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.stepbtns button.on{background:var(--acc);color:#08111a;border-color:transparent}
.steptxt{padding:12px 14px 16px;border-top:1px solid var(--line);background:var(--card2);min-height:96px}
.sn{font:800 10.5px var(--mono);letter-spacing:.14em;color:var(--acc);margin-bottom:6px}
.steptxt p{font-size:15.5px;line-height:1.5}
.boxes{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.box{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bc)}
.box h3{font:800 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--bc);margin-bottom:6px}
.box p{font-size:14px;line-height:1.5;color:var(--text)}
.b1{--bc:#3b9eff}.b2{--bc:#2fd27a}.b3{--bc:#f5c542}.b4{--bc:#ff4d6d}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pnav button{text-align:left;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.pnav button.nx{text-align:right}
.pnav small{display:block;font:800 10px var(--mono);letter-spacing:.12em;color:var(--muted);margin-bottom:3px}
.quizbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);max-width:760px}
.qtop{display:flex;justify-content:space-between;margin-bottom:8px}
.qcv{display:block;width:100%;aspect-ratio:10/7;border-radius:12px;border:1px solid var(--line);margin:14px 0 4px}
.quizbox h2{font:700 19px/1.35 var(--sans);margin:14px 0 12px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:13px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:15px;font-weight:500}
.opts button:hover:not(:disabled){border-color:var(--acc)}
.opts button.right{background:color-mix(in srgb,#2fd27a 18%,var(--card2));border-color:#2fd27a}
.opts button.wrong{background:color-mix(in srgb,#ff4d6d 18%,var(--card2));border-color:#ff4d6d}
.fb{margin-top:12px;padding:14px;border-radius:14px;border:1px solid}
.fb.ok{border-color:#2fd27a;background:color-mix(in srgb,#2fd27a 8%,transparent)}
.fb.no{border-color:#ff4d6d;background:color-mix(in srgb,#ff4d6d 8%,transparent)}
.fb p{margin:6px 0 10px;font-size:14px;line-height:1.5}
.fbb{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.primary{background:var(--acc);color:#08111a;font-weight:800;padding:11px 16px;border-radius:12px}
.ghost{border:1px solid var(--line2);padding:11px 14px;border-radius:12px;font-weight:600}
.end{text-align:center}
.end .score{font:800 76px var(--mono);color:var(--acc);margin:8px 0 0}
.end .score small{font-size:28px;color:var(--muted)}
.end .msg{font-size:20px;font-weight:700}
.muted{color:var(--muted);margin:4px 0 14px}
.end h3{font:800 12px var(--mono);letter-spacing:.08em;margin:12px 0 8px;color:var(--muted)}
.rep{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.rep button{display:flex;gap:6px;align-items:center;padding:9px 12px;border-radius:999px;border:1px solid var(--acc);font-weight:600;font-size:13px}
.end .fbb{justify-content:center}
@media (min-width:760px){
  .bento{grid-template-columns:repeat(3,1fr)}
  .tile{min-height:200px}
  .lessons{grid-template-columns:repeat(3,1fr)}
  .boxes{grid-template-columns:1fr 1fr}
  .tile.quiz{grid-column:span 1}
}
@media (min-width:1040px){
  #side{display:block;width:270px;flex:none;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;padding:16px 10px 30px 16px;border-right:1px solid var(--line)}
  #view{padding:24px 28px 80px}
  .search input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:500 13px var(--sans);outline:none}
  .search input:focus{border-color:#2fd27a}
  .sg{margin-top:14px}
  .sh{font:800 10.5px var(--mono);letter-spacing:.1em;color:var(--acc);padding:4px 6px}
  .si{display:flex;justify-content:space-between;width:100%;text-align:left;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--muted)}
  .si:hover{background:var(--card);color:var(--text)}
  .si.on{background:color-mix(in srgb,var(--acc) 16%,var(--card));color:var(--text);box-shadow:inset 3px 0 0 var(--acc)}
  .si b{color:#2fd27a}
  .player{max-width:860px}
}
@media (max-width:380px){.theme button{padding:6px 7px;font-size:10px}.logo span{font-size:14px}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><div class="mk">F</div><div><b>BAYAZIT</b><span>Fitness-Schule</span></div></div>
  <div class="theme" role="group" aria-label="Darstellung">
    <button data-m="dark" title="Dunkel">☾ Dunkel</button><button data-m="light" title="Hell">☀ Hell</button><button data-m="auto" title="Automatisch">◐ Auto</button>
  </div>
</header>
<div class="wrap"><aside id="side"></aside><main id="view"></main></div>
<script>
/* ===== Bayazit Fitness-Schule – Daten ===== */
const G = 248;
function ik(x, y, b) { return { ik: [x, y], b: b === undefined ? 1 : b }; }
function ST(x, o) { return Object.assign({ x: x, y: 153, t: 180, a1: [0, 0], a2: [0, 0], l1: ik(x - 2, G), l2: ik(x + 4, G) }, o || {}); }

const AREAS = [
  { id: 'grund', t: 'Grundlagen', ic: '🧭', c: '#3b9eff', d: 'Aufwärmen, Atmung, Haltung und wie Training wirkt' },
  { id: 'ober', t: 'Oberkörper', ic: '💪', c: '#ff8a3d', d: 'Brust, Schultern, Arme und Rücken' },
  { id: 'beine', t: 'Beine & Po', ic: '🦵', c: '#2fd27a', d: 'Kraft von unten – die größten Muskeln' },
  { id: 'rumpf', t: 'Rumpf & Bauch', ic: '🎯', c: '#b07cff', d: 'Die stabile Mitte für jede Bewegung' },
  { id: 'cardio', t: 'Ausdauer & Dehnen', ic: '🔥', c: '#ff4d6d', d: 'Herz, Kondition und Beweglichkeit' },
  { id: 'plan', t: 'Trainingspläne', ic: '📅', c: '#f5c542', d: 'Pläne, Puls und richtig steigern' }
];

/* gemeinsame Posen */
const SQ_A = ST(200);
const SQ_B = { x: 172, y: 205, t: 140, a1: [85, 90], a2: [88, 90], l1: ik(198, G), l2: ik(204, G) };
const PL = { x: 189, y: 221, t: 100, a1: [0, 90], a2: [2, 90], l1: ik(86, 238), l2: ik(90, 238), ft1: 20, ft2: 20 };
const PU_T = { x: 183, y: 198, t: 113, a1: ik(250, G, -1), a2: ik(256, G, -1), l1: ik(88, 236), l2: ik(92, 236), ft1: 25, ft2: 25 };
const PU_B = { x: 191, y: 230, t: 94, a1: ik(250, G, -1), a2: ik(256, G, -1), l1: ik(88, 236), l2: ik(92, 236), ft1: 25, ft2: 25 };
const KP_A = { x: 177, y: 214, t: 129, a1: ik(230, G, -1), a2: ik(234, G, -1), l1: [-50, -125], l2: [-50, -118] };
const KP_B = { x: 187, y: 236, t: 101, a1: ik(230, G, -1), a2: ik(234, G, -1), l1: [-79, -128], l2: [-79, -121] };
const BR_A = { x: 200, y: 238, t: -90, a1: [90, 90], a2: [92, 90], l1: ik(238, G), l2: ik(242, G) };
const BR_B = { x: 206, y: 206, t: -68, a1: [92, 92], a2: [94, 92], l1: ik(238, G), l2: ik(242, G) };
const HJ_A = { fv: 1, x: 200, y: 153, t: 180, a1: [-8, -4], a2: [8, 4], l1: [-2, -2], l2: [2, 2] };
const HJ_J = { fv: 1, x: 200, y: 138, t: 180, a1: [-90, -100], a2: [90, 100], l1: [-8, -8], l2: [8, 8] };
const HJ_B = { fv: 1, x: 200, y: 155, t: 180, a1: [-150, -165], a2: [150, 165], l1: [-16, -16], l2: [16, 16] };

const LESSONS = [
/* ================= GRUNDLAGEN ================= */
{ id: 'aufwaermen', b: 'grund', t: 'Richtig aufwärmen', s: 'Puls hoch, Gelenke bereit', m: 'Ganzer Körper, Herz-Kreislauf', lvl: 'Einsteiger',
  props: { mat: [120, 290] },
  poses: { S: ST(200), M1: ST(200, { a2: [170, 175], a1: [-25, -15], l2: [75, 0] }), M2: ST(200, { a1: [170, 175], a2: [-25, -15], l1: [75, 0] }),
           Q: { x: 186, y: 190, t: 155, a1: [80, 85], a2: [82, 85], l1: ik(198, G), l2: ik(204, G) } },
  seg: 0.7,
  steps: [
    { p: ['S'], txt: 'Warum aufwärmen? Muskeln, Sehnen und Gelenke werden besser durchblutet – du bist leistungsfähiger und beugst Verletzungen vor.', lab: [['5–10 Minuten', 'head', 60, -10]] },
    { p: ['S', 'M1', 'S', 'M2'], pt: ['MARSCHIEREN'], hi: ['th1', 'th2'], txt: 'Starte mit lockerem Marschieren auf der Stelle und schwinge die Arme mit. Der Puls steigt langsam an.', lab: [['Knie hoch', 'kne2', 45, -10]] },
    { p: ['S', 'Q'], pt: ['MOBILISIEREN'], txt: 'Danach die Gelenke mobilisieren: Arme kreisen, Hüfte kreisen und ein paar lockere, halbe Kniebeugen.', lab: [['Gelenke bewegen', 'kne2', 50, -20]] },
    { p: ['S', 'M1', 'S', 'M2'], pt: ['ÜBUNGSNAH'], txt: 'Zum Schluss 1–2 Übungen aus deinem Training ganz leicht ausführen. Wenn du leicht schwitzt, bist du bereit.', lab: [['Leicht schwitzen = gut', 'head', 70, -6]] }
  ],
  info: ['Aufwärmen bereitet Kreislauf, Muskeln und Gelenke auf die Belastung vor.',
         'Erst allgemein (Marschieren, Hampelmann), dann Gelenke mobilisieren, dann übungsnah – insgesamt 5–10 Minuten.',
         'Warme Muskeln sind elastischer und reagieren schneller. Das Verletzungsrisiko sinkt, die Leistung steigt.',
         'Lange, statische Dehnungen gehören eher ans Ende. Vor dem Training lieber dynamisch bewegen.'] },

{ id: 'atmung', b: 'grund', t: 'Richtig atmen', s: 'Ausatmen bei Anstrengung', m: 'Zwerchfell, Rumpf', lvl: 'Einsteiger',
  props: { mat: [120, 290] },
  poses: { A: SQ_A, B: SQ_B, P: PL },
  steps: [
    { p: ['A'], txt: 'Beim Krafttraining gilt eine einfache Regel: In der leichten Phase einatmen, in der anstrengenden Phase ausatmen.', lab: [['Atmung = Kraft', 'head', 60, -8]] },
    { p: ['A', 'B'], br: 1, pt: ['RUNTER · EINATMEN', 'HOCH · AUSATMEN'], txt: 'Bei der Kniebeuge: Beim Runtergehen ruhig durch die Nase einatmen – der Bauch füllt sich mit Luft.' },
    { p: ['A', 'B'], br: 1, hi: ['tr'], pt: ['RUNTER · EINATMEN', 'HOCH · AUSATMEN'], txt: 'Beim Hochdrücken durch den Mund ausatmen. So bleibt der Rumpf stabil und du hältst die Luft nicht an.', lab: [['Rumpf fest', 'mid', 55, -10]] },
    { p: ['P'], hold: 20, br: 1, pt: ['RUHIG WEITERATMEN'], txt: 'Bei Halteübungen wie dem Unterarmstütz gleichmäßig weiteratmen – niemals die Luft anhalten.', lab: [['Nicht pressen', 'head', 10, -45]] }
  ],
  info: ['Die richtige Atmung versorgt die Muskeln mit Sauerstoff und stabilisiert den Rumpf.',
         'Leichte Phase (z. B. runter) = einatmen. Anstrengende Phase (z. B. hoch) = ausatmen.',
         'Wer die Luft anhält und presst, lässt den Blutdruck stark ansteigen – das ist unnötig und belastend.',
         'Zähl im Kopf mit: 2 Sekunden runter (ein), 1 Sekunde hoch (aus). So findest du einen Rhythmus.'] },

{ id: 'haltung', b: 'grund', t: 'Neutrale Wirbelsäule', s: 'Der gerade Rücken schützt', m: 'Rückenstrecker, Bauch', lvl: 'Einsteiger',
  props: { mat: [120, 290] },

  const q = Q.qs[Q.i];
  view().innerHTML = `
  <div class="crumbs"><button class="back" data-go="">← Startseite</button></div>
  <section class="quizbox" style="--acc:#22d3ee">
    <div class="qtop"><span class="kick">FRAGE ${Q.i + 1} / ${Q.qs.length}</span><span class="kick">PUNKTE ${Q.score}</span></div>
    <div class="bar"><i style="width:${Q.i / Q.qs.length * 100}%"></i></div>
    ${q.pic ? `<canvas id="qcv" class="qcv"></canvas>` : ''}
    <h2>${esc(q.q)}</h2>
    <div class="opts">${q.opts.map((o, i) => `<button data-o="${i}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  if (q.pic) {
    const cv = $('#qcv'), w = cv.clientWidth || 340, dpr = Math.min(2.5, window.devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = w * .7 * dpr; const c = cv.getContext('2d'); c.setTransform(cv.width / 400, 0, 0, cv.width / 400, 0, 0);
    Q.draw = () => drawStatic(c, LES[q.pic]); Q.draw();
  } else Q.draw = null;
  $$('.opts button').forEach(b => b.onclick = () => answer(+b.dataset.o));
}
function answer(i) {
  const q = Q.qs[Q.i]; if (Q.answered) return; Q.answered = true;
  const ok = i === q.c; if (ok) Q.score++; else Q.wrong.push(q.l);
  $$('.opts button').forEach((b, k) => { b.disabled = true; if (k === q.c) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
  const L = LES[q.l];
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? '✓ Richtig!' : '✗ Leider falsch.'}</b><p>${esc(q.e)}</p>
    <div class="fbb">${L ? `<button class="ghost" data-go="l-${L.id}">Zur Lektion: ${esc(L.t)}</button>` : ''}<button class="primary" id="nextq">${Q.i < Q.qs.length - 1 ? 'Nächste Frage →' : 'Ergebnis anzeigen'}</button></div></div>`;
  $('#nextq').onclick = () => { Q.answered = false; if (++Q.i < Q.qs.length) quizStep(); else quizEnd(); };
  $('#nextq').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function quizEnd() {
  const nb = Q.score > best; if (nb) { best = Q.score; LS.set('fit-best', best); }
  const rep = [...new Set(Q.wrong)].map(id => LES[id]).filter(Boolean);
  const msg = Q.score >= 9 ? 'Spitzenklasse! 🏆' : Q.score >= 7 ? 'Stark gemacht! 💪' : Q.score >= 5 ? 'Gute Basis – weiter so!' : 'Dranbleiben – Übung macht den Meister.';
  view().innerHTML = `
  <div class="crumbs"><button class="back" data-go="">← Startseite</button></div>
  <section class="quizbox end" style="--acc:#22d3ee">
    <div class="kick">ERGEBNIS</div>
    <div class="score">${Q.score}<small>/10</small></div>
    <p class="msg">${msg}</p>
    <p class="muted">${nb ? 'Neuer Bestwert!' : 'Bestwert: ' + best + '/10'}</p>
    ${rep.length ? `<h3>Diese Lektionen solltest du wiederholen:</h3><div class="rep">${rep.map(l => `<button data-go="l-${l.id}" style="--acc:${AREA[l.b].c}"><span>${AREA[l.b].ic}</span>${esc(l.t)}</button>`).join('')}</div>` : '<p>Alles richtig – nichts zu wiederholen!</p>'}
    <div class="fbb"><button class="primary" id="again">Nochmal spielen</button><button class="ghost" data-go="">Zur Startseite</button></div>
  </section>`;
  $('#again').onclick = renderQuiz;
}

/* ---------- Seitenleiste (PC) ---------- */
function buildSide() {
  const s = $('#side'); if (!s) return;
  s.innerHTML = `<div class="search"><input id="q" type="search" placeholder="Übung suchen …" aria-label="Suchen"></div><div id="slist"></div>`;
  $('#q').oninput = refreshSide; refreshSide();
}
function refreshSide() {
  const box = $('#slist'); if (!box) return;
  const q = ($('#q') && $('#q').value || '').toLowerCase().trim();
  box.innerHTML = AREAS.map(a => {
    const ls = lessonsOf(a.id).filter(l => !q || (l.t + ' ' + l.s + ' ' + l.m).toLowerCase().includes(q));
    if (!ls.length) return '';
    return `<div class="sg" style="--acc:${a.c}"><button class="sh" data-go="b-${a.id}">${a.ic} ${esc(a.t.toUpperCase())}</button>${ls.map(l => `<button class="si${seen.has(l.id) ? ' done' : ''}" data-go="l-${l.id}" data-id="${l.id}">${esc(l.t)}${seen.has(l.id) ? '<b>✓</b>' : ''}</button>`).join('')}</div>`;
  }).join('') + `<div class="sg" style="--acc:#22d3ee"><button class="sh" data-go="quiz">🏆 QUIZ</button></div>`;
  setActive(curId);
}
let curId = '';
function setActive(id) { curId = id; $$('#slist .si').forEach(b => b.classList.toggle('on', b.dataset.id === id)); }

/* ---------- Navigation ---------- */
function route() {
  const h = (location.hash || '').replace('#', '');
  if (h.startsWith('b-')) renderArea(h.slice(2));
  else if (h.startsWith('l-')) renderLesson(h.slice(2));
  else if (h === 'quiz') renderQuiz();
  else renderHome();
  window.scrollTo(0, 0);
}
function go(h) { if (('#' + h) === location.hash || (!h && !location.hash)) route(); else location.hash = h; }
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { e.preventDefault(); go(b.dataset.go); } });
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (vid && vid.fit) vid.fit(); if (Q && Q.draw && $('#qcv')) { /* bleibt */ } });
function redrawAll() { if (vid && vid.draw) vid.draw(); if (Q && Q.draw && $('#qcv')) Q.draw(); if ($('canvas[data-thumb]')) drawThumbs(); }

$$('.theme button').forEach(b => b.onclick = () => applyTheme(b.dataset.m));
applyTheme(themeMode);
buildSide();
route();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawAll);

</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
